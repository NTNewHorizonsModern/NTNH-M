[render]
	#If enabled, will try to use NTM's custom skyboxes.
	skyboxes = true
	cooling_tower_particles = true
	#Draw pylon wires with sag instead of straight.
	cable_hang = true
	#Draw rebar as three rods instead of twelve.
	simple_rebar = false

[hud]
	# Default: 0
	# Range: > -2147483648
	tool_indicator_x = 0
	# Default: 0
	# Range: > -2147483648
	tool_indicator_y = 0
	nuke_flash = true
	nuke_shake = true
	# Default: 0
	# Range: > -2147483648
	geiger_offset_horizontal = 0
	# Default: 0
	# Range: > -2147483648
	geiger_offset_vertical = 0
	# Default: 0
	# Range: > -2147483648
	info_position = 0
	# Default: 0
	# Range: > -2147483648
	info_offset_horizontal = 0
	# Default: 0
	# Range: > -2147483648
	info_offset_vertical = 0
	#Show what an item adds to a custom nuke.
	tooltip_custom_nuke = true
	#List an RBMK column's diagnostic data while looking at it.
	dodd_rbmk_diagnostic = true

[interaction]
	#Right-click with a held crate opens it; sneak to place it.
	crate_opens_held = true
	#Keep the recipe browser from offering the recipes that are meant to be found rather than looked up. They stay craftable.
	recipe_viewer_hides_secrets = true

[audio]
	#Preserve stereo explosion recordings instead of positioning them in the world, with distance falloff. Mono recordings remain positional. Applies to newly played sounds.
	original_stereo_explosions = false
	# Default: 0.1
	# Range: 0.0 ~ 3.4028234663852886E38
	ship_hum_volume = 0.1

[guns]
	#Render held gun models with the game's FOV setting instead of the fixed gun FOV.
	model_fov = false
	visual_recoil = true
	# Default: 1.0
	# Range: 0.001 ~ 100.0
	animation_speed = 1.0
	#Use the hand-authored gun animations instead of the Blender-exported sets.
	legacy_animations = false

[space]
	#Should ores indicate which planets they can be found on.
	show_ore_locations = true
	#If enabled, sets night-time minimum fog to zero, to complement hardcore darkness mods
	hardcore_darkness = false
