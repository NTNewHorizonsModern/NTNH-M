[items]
	#Register the Carpenter's Hammer.
	enableHammer = true
	#Register the Carpenter's Chisel.
	enableChisel = true
	#Register the Carpenter's Tile.
	enableTile = true
	#Uses before a hammer or chisel breaks.
	# Default: 400
	# Range: 1 ~ 100000
	toolUses = 400
	#Hammers and chisels take damage when used.
	toolsDamageable = true
	#Chance that the hammer takes damage when it rotates or alters a slope.
	# Default: 0.75
	# Range: 0.0 ~ 1.0
	itemHammerDamageChanceFromSlopes = 0.75
	#Chance that the hammer takes damage when it rotates or alters stairs.
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	itemHammerDamageChanceFromStairs = 1.0
	#Chance that the hammer takes damage when it adjusts a collapsible block.
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	itemHammerDamageChanceFromCollapsible = 0.2

