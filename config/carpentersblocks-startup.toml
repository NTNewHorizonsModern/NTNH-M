	#Register the Carpenter's Ladder.
	enableLadder = true
	#Register the Carpenter's Lever.
	enableLever = true
	#Register the Carpenter's Pressure Plate.
	enablePressurePlate = true
	#Register the Carpenter's Safe.
	enableSafe = true
	#Register the Carpenter's Slope.
	enableSlope = true
	#Register the Carpenter's Stairs.
